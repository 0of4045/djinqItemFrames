name: djinqItemFrames
version: 1.0.1
main: dev.djinq.djinqitemframes.DjinqItemFrames
api-version: '1.21'
description: Lightweight item frame toggle for Paper.
author: djinq
website: https://djinq.dev

commands:
  itemframe:
    description: Toggles the item frame you are looking at.
    usage: /itemframe [reload]
    permission: djinqitemframes.use

permissions:
  djinqitemframes.use:
    description: Allows /itemframe.
    default: true
  djinqitemframes.reload:
    description: Allows /itemframe reload.
    default: op
